<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>autocrystal scene</title>
<!--
  The whole stream layout, for OBS: one Browser Source, 1920x1080, ABOVE the
  game capture. Where everything goes comes from layout.json (made once with
  editor.html; see layouts.js) - the game capture goes where the layout's
  "game" box is, and stays clear here. Everything else is drawn from the
  game's own tiles, font, Pokegear frame, Pokemon pictures and party icons
  (gsc.js); clouds drift along the top of every panel. Put clouds.html at
  the very bottom for the gaps.

  Picks up a newly saved layout.json by itself within a few seconds.

  Options (after the address, joined with &):
    speed=30   milliseconds per letter in the chat
    demo=1     sample data, without the bot
    edit=1     driven by editor.html (layouts come from it, not the file)
  crop=t,r,b,l  the browser preview of BizHawk (below): pixels of the
             captured window to cut off - its title bar, menu and status bar
  fit=stretch   the preview fills the game box (default: keeps its shape)

  In a normal browser (not OBS, not the editor) a "Show BizHawk here" button
  sits in the game box: it asks the browser to share a window (pick
  BizHawk) and shows it there, under the panels - a preview only; OBS uses
  its own capture under this page and never shows the button.
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; position: relative; z-index: 1; pointer-events: none; }
  #game { position: absolute; z-index: 0; overflow: hidden; display: none; }
  #game video { position: absolute; }
  #pick { position: absolute; z-index: 2; display: none; font: 600 22px sans-serif; padding: 14px 22px;
          border: 2px solid #444; border-radius: 10px; background: #f4f4f4; color: #222; cursor: pointer;
          width: 420px; box-sizing: border-box; }
  #pick small { display: block; font-weight: 400; font-size: 14px; margin-top: 4px; color: #555; }
</style>
</head>
<body>
<div id="game"><video id="gameVideo" autoplay muted playsinline></video></div>
<button id="pick">Show BizHawk here<small>pick the BizHawk window - preview only, OBS has its own capture</small></button>
<canvas id="scene"></canvas>
<script src="gsc.js"></script>
<script src="layouts.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const LETTER_MS = Math.max(5, parseInt(params.get("speed") || "30", 10));
  const DEMO = params.get("demo") === "1";
  const EDIT = params.get("edit") === "1";
  // The pinned news's look (?pin=, for trying them - the user, 2026-11-10:
  // "other presentation options, other borders, make it stand out"):
  // words joined by "+": frameN (one of the game's 9 text frames instead of
  // the first), title (SHINY! / RARE! in the top edge), icon (its party
  // icon, in its own colours, at the right). The user's pick, 2026-11-10:
  // the title, in frame 6.
  const PIN_STYLE = (params.get("pin") || "frame6+title").split("+").filter(Boolean);
  const PIN_FRAME = Number((PIN_STYLE.find(w => /^frame\d$/.test(w)) || "").slice(5)) || 0;

  let LAYOUT = await AC_LAYOUT.load(params.get("layout"));   // (?layout=<file>.json: another layout to show - layouts.js)
  let SCALE, T, W, H, gsc, PAL;
  const loaded = {};   // the game's graphics, per palette (Gold's or Kris's)
  async function apply(layout) {
    LAYOUT = layout;
    SCALE = Math.max(1, Math.min(4, parseInt(layout.scale, 10) || 2));
    T = 8 * SCALE;
    W = Math.ceil(1920 / T); H = Math.ceil(1080 / T);
    const key = layout.girl ? "girl" : "boy";
    loaded[key] = loaded[key] || await GSC.load("gfx/", { girl: !!layout.girl, boxFrame: PIN_FRAME });
    gsc = loaded[key]; PAL = gsc.palettes[0];
    placeGame();
  }

  // ----- the browser preview of BizHawk (not in OBS: it captures the game itself) -----
  const IN_OBS = typeof window.obsstudio !== "undefined";
  const CROP = (params.get("crop") || "0,0,0,0").split(",").map(v => Math.max(0, parseInt(v, 10) || 0));
  while (CROP.length < 4) CROP.push(0);
  const STRETCH = params.get("fit") === "stretch";
  const gameBox = document.getElementById("game"), gameVideo = document.getElementById("gameVideo");
  const pick = document.getElementById("pick");
  let sharing = false;
  function placeGame() {
    const g = (LAYOUT && LAYOUT.game) || { x: 0, y: 0, w: 1248, h: 848 };
    Object.assign(gameBox.style, { left: g.x + "px", top: g.y + "px", width: g.w + "px", height: g.h + "px" });
    const show = !IN_OBS && !EDIT && !sharing;
    pick.style.display = show ? "block" : "none";
    if (show) {
      pick.style.left = (g.x + g.w / 2 - pick.offsetWidth / 2) + "px";
      pick.style.top = (g.y + g.h / 2 - pick.offsetHeight / 2) + "px";
    }
    const vw = gameVideo.videoWidth, vh = gameVideo.videoHeight;
    if (!vw || !vh) return;
    // what's left of the window after the crop, scaled into the box
    const cw = Math.max(1, vw - CROP[1] - CROP[3]), ch = Math.max(1, vh - CROP[0] - CROP[2]);
    let sx = g.w / cw, sy = g.h / ch;
    if (!STRETCH) sx = sy = Math.min(sx, sy);
    const ox = (g.w - cw * sx) / 2, oy = (g.h - ch * sy) / 2;
    Object.assign(gameVideo.style, { width: vw * sx + "px", height: vh * sy + "px",
      left: (ox - CROP[3] * sx) + "px", top: (oy - CROP[0] * sy) + "px" });
    // (the box itself: just the part showing the game, so nothing spills)
    Object.assign(gameBox.style, { left: (g.x + ox) + "px", top: (g.y + oy) + "px", width: cw * sx + "px", height: ch * sy + "px" });
    gameVideo.style.left = (-CROP[3] * sx) + "px"; gameVideo.style.top = (-CROP[0] * sy) + "px";
  }
  pick.addEventListener("click", async () => {
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({
        video: { displaySurface: "window", frameRate: 60 }, audio: false, selfBrowserSurface: "exclude" });
      gameVideo.srcObject = stream;
      sharing = true; gameBox.style.display = "block";
      stream.getVideoTracks()[0].addEventListener("ended", () => {
        sharing = false; gameBox.style.display = "none"; gameVideo.srcObject = null; placeGame();
      });
      placeGame();
    } catch (e) { /* cancelled */ }
  });
  gameVideo.addEventListener("loadedmetadata", placeGame);
  gameVideo.addEventListener("resize", placeGame);
  await apply(LAYOUT);

  const [SPECIES, ICONS] = await Promise.all([
    fetch("gfx/species.json").then(r => r.json()), fetch("gfx/icons.json").then(r => r.json())]);
  const name = id => SPECIES[id - 1] || "?????";
  const canvas = document.getElementById("scene");
  canvas.width = 1920; canvas.height = 1080;
  const ctx = canvas.getContext("2d");
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

  // ----- data -----
  const now = Math.floor(Date.now() / 1000);
  // Route 29 as the game has it (data/wild/johto_grass.asm): morning and day
  // the same, Hoothoot and Rattata at night.
  const DEMO_DAY = [
    { species: 16, odds: 50, low: 2, high: 3 }, { species: 161, odds: 40, low: 2, high: 3 },
    { species: 19, odds: 5, low: 2, high: 2 }, { species: 187, odds: 5, low: 3, high: 3 }];
  const DEMO_NITE = [
    { species: 163, odds: 55, low: 2, high: 3 }, { species: 19, odds: 45, low: 2, high: 3 }];
  // ?mode=fish / ?mode=tree: the preview as the Fishing or Headbutt module
  // sends it - the Good Rod at the shore (data/wild/fish.asm: Corsola by
  // day, Staryu by night), Route 29's common trees (data/wild/treemons.asm).
  const DEMO_MODE = params.get("mode");
  const DEMO_FISH_DAY = [
    { species: 129, odds: 35, low: 20, high: 20 }, { species: 98, odds: 56, low: 20, high: 20 }, { species: 222, odds: 9, low: 20, high: 20 }];
  const DEMO_FISH_NITE = [
    { species: 129, odds: 35, low: 20, high: 20 }, { species: 98, odds: 56, low: 20, high: 20 }, { species: 120, odds: 9, low: 20, high: 20 }];
  const DEMO_TREE = [
    { species: 163, odds: 50, low: 10, high: 10 }, { species: 167, odds: 15, low: 10, high: 10 },
    { species: 165, odds: 15, low: 10, high: 10 }, { species: 102, odds: 20, low: 10, high: 10 }];
  const demoHere = () => DEMO_MODE === "fish"
    ? { kind: "fish", rod: "GOOD ROD", now: "DAY", list: DEMO_FISH_DAY, morn: DEMO_FISH_DAY, day: DEMO_FISH_DAY, nite: DEMO_FISH_NITE }
    : DEMO_MODE === "tree" ? { kind: "tree", tree: "COMMON", list: DEMO_TREE }
    : { kind: "walk", now: "DAY", list: DEMO_DAY, morn: DEMO_DAY, day: DEMO_DAY, nite: DEMO_NITE, water: [] };
  // What the demo's random encounters come from.
  const demoWild = tod => DEMO_MODE === "fish" ? (tod === "NITE" ? DEMO_FISH_NITE : DEMO_FISH_DAY)
    : DEMO_MODE === "tree" ? DEMO_TREE : (tod === "NITE" ? DEMO_NITE : DEMO_DAY);
  let state = DEMO ? {
    location: "ROUTE 29", time_of_day: "DAY", clock: { day: 1, hours: 16, minutes: 24 },
    total: 50546, shinies: 9, since_shiny: 12433, per_hour: 412, runtime: 189240, joey: 1152, phone: { mins: 12 },
    next: "6 PM - ROUTE 31 FOR GASTLY", phase: { caught: 2, total: 26 },
    encounters: [
      { species: 161, atk: 9, def: 4, spe: 12, spc: 7, item: "BERRY" },
      { species: 16, atk: 6, def: 10, spe: 10, spc: 10 },
      { species: 19, atk: 0, def: 6, spe: 2, spc: 10 },
      { species: 161, atk: 12, def: 4, spe: 9, spc: 13, item: "BERRY" },
      { species: 16, atk: 15, def: 7, spe: 9, spc: 7 },
      { species: 187, atk: 3, def: 11, spe: 8, spc: 2 },
    ],
    current: { species: 161, atk: 9, def: 4, spe: 12, spc: 7, item: "BERRY", streak: 1 },
    recent_shinies: [
      { species: 41, atk: 15, def: 10, spe: 10, spc: 10, time: now - 288000 },
      { species: 74, atk: 7, def: 10, spe: 10, spc: 10, time: now - 241200 },
      { species: 163, atk: 6, def: 10, spe: 10, spc: 10, time: now - 3600 },
      { species: 16, atk: 2, def: 10, spe: 10, spc: 10, time: now - 600000 },
    ],
    targets: [161, 187, 19, 16], caught: [16, 19],
    here: demoHere(),
  } : {};

  const fmt = n => Number(n || 0).toLocaleString("en-US");
  // How long the bot has run: "2D 04H 12M", "4H 12M", "12M" ("-" before it's known).
  const runtimeText = secs => {
    if (secs == null) return "-";
    const d = Math.floor(secs / 86400), h = Math.floor(secs % 86400 / 3600), m = Math.floor(secs % 3600 / 60);
    return d ? `${d}D ${String(h).padStart(2, "0")}H ${String(m).padStart(2, "0")}M` : h ? `${h}H ${String(m).padStart(2, "0")}M` : `${m}M`;
  };
  const up = s => String(s == null ? "" : s).toUpperCase();
  const pad = (s, w) => String(s).padStart(w).slice(-w);
  const dvs = m => (m && m.atk != null) ? `${m.atk}/${m.def}/${m.spe}/${m.spc}` : "?/?/?/?";
  const DAYS = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
  const TOD_WORD = { MORN: "MORNING", DAY: "DAYTIME", NITE: "NIGHT" };
  function ago(t, short) {
    if (!t) return "";
    const s = Math.max(0, Math.floor(Date.now() / 1000) - t);
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    if (short) return d ? `${d}D` : h ? `${h}H` : `${m}M`;
    return (d ? `${d}D ${h}H` : h ? `${h}H ${m}M` : `${m}M`) + " AGO";
  }
  function clockText() {
    const c = state.clock;
    if (!c) return "";
    const h = c.hours, m = String(c.minutes).padStart(2, "0");
    return `${DAYS[c.day] || ""} ${(h % 12) || 12}:${m} ${h < 12 ? "AM" : "PM"}`;
  }

  // ----- the chat log: {id, text, time} oldest first -----
  let log = [], blink = true;

  // ----- the modules -----
  // Each draws into a panel x, y, w, h (tiles). Two tile layers: the frames,
  // and the content drawn half a tile lower - a panel h tiles high holds
  // h-3 rows with half a tile clear above and below. Text starts two tiles
  // in from each side: the Pokegear frame is thick.
  let frames, s, panels, pictures, icons, lists = [];
  // The streak badge ("x7" by the current encounter - the user, 2026-11-11):
  // where it goes ({text, right, row} in tiles), and when its number last
  // went up (it pops then).
  let badges = [], drawnBadges = [], streakPump = { key: null, at: 0 };
  const line = (x0, x1, y) => { for (let i = x0; i < x1; i++) s.put(i, y, GSC.CHARS["─"], 0); };
  const smallTiles = () => Math.ceil(56 / T);   // a small picture (1 screen pixel a pixel), in tiles

  // The chat, like an IRC channel: only what matters (a shiny, a catch,
  // trouble), newest at the top, each with the time it came in, a blank
  // line between. A new message slides the others down - slower than the
  // encounter list. The ▼ blinks after the newest.
  const two = n => String(n).padStart(2, "0");
  const stamp = t => { const d = new Date((t || 0) * 1000); return `${two(d.getHours())}:${two(d.getMinutes())}`; };
  function chat(x, y, w, h) {
    const l = x + 2, r = x + w - 2, bottom = y + h - 3;
    let top = y + 3;
    centred(l, r - l, y + 1, "LOG");
    // The big news (a shiny, perfect DVs): pinned above the rest in the
    // game's own text box for 8 hours (the user, 2026-11-10: "a sticky
    // event... stays for like 12h and gets highlighted"), its time in front
    // like every line ("remove the 1 hour ago and add the regular timestamp
    // like the other news"). At most 3 rows; the log goes on under it.
    const pin = state.pin && Date.now() / 1000 < state.pin.till ? state.pin : null;
    const indent = 6;
    if (pin) {
      const inner = r - l, withIcon = PIN_STYLE.includes("icon") && pin.species;
      const rows = wrapText(readable(pin.text), inner - indent - (withIcon ? 3 : 0)).slice(0, 3);
      s.textbox(l - 1, top - 1, rows.length, inner, 0, PIN_FRAME ? 0x61 : 0x79);
      // (how long ago, in the title - always: the user, 2026-11-10, "lets
      // always keep the xx ago not only after midnight"; the time column
      // stays like every line's; gone after 8 hours). SHINY! at the left
      // of the top edge, the time ago at the right - out of the LOG
      // heading's way (the user, 2026-11-10).
      if (PIN_STYLE.includes("title")) {
        const secs = Date.now() / 1000 - (pin.time || 0), hrs = Math.floor(secs / 3600), mins = Math.floor(secs / 60);
        const ago = mins < 1 ? " JUST NOW " : hrs < 1 ? " " + mins + (mins === 1 ? " MINUTE AGO " : " MINUTES AGO ")
          : " " + hrs + (hrs === 1 ? " HOUR AGO " : " HOURS AGO ");
        const head = /shiny/i.test(pin.text) ? " SHINY! " : " RARE! ";
        s.text(l + 1, top - 1, head.slice(0, Math.max(0, inner - 2)));
        const at = l + inner - 1 - ago.length;
        if (at >= l + 1 + head.length) s.text(at, top - 1, ago);
      }
      s.text(l, top, stamp(pin.time));
      rows.forEach((t, i) => s.text(l + indent, top + i, t));
      if (withIcon) icons.push([pin.species, r - 2, top + (rows.length > 1 ? 0.5 : 0) - 0.25, null, true]);
      top += rows.length + 2;
    }
    // The entries one under the other with LOG_GAP Game Boy pixels between
    // them, not a blank row (the user, 2026-11-11: the log held 3-4) - drawn
    // touching on the tile layer, each painted that much lower than the one
    // above (entries). Only whole ones show (fullPx: where the last whole
    // one ends, in pixels below top).
    const list = new gsc.Screen(W, H, null);
    const roomPx = (bottom - top + 1) * 8;
    let ry = top, firstHeight = 0, key = null, fullPx = 0;
    const entries = [];
    // (routine lines keep one entry each - the newest of its kind, at its
    // place in time; the older ones of that kind drop out: the user,
    // 2026-11-11, "the log... its only talking about joey" - so the rare
    // ones stay up for hours, like a feed)
    const seenKind = new Set();
    const newest = log.slice().reverse().filter(m => {
      const k = LOG_KIND.find(([, re]) => re.test(m.text));
      if (!k) return true;
      if (seenKind.has(k[0])) return false;
      seenKind.add(k[0]);
      return true;
    });
    for (let i = 0; i < newest.length; i++) {
      const m = newest[i];
      const lines = wrapText(m.text, r - l - indent);
      list.text(l, ry, stamp(m.time));
      lines.forEach((t, j) => list.text(l + indent, ry + j, t));
      if (i === 0) {
        firstHeight = lines.length + LOG_GAP / 8; key = String(m.id);
        if (blink) list.put(Math.min(r, l + indent + lines[lines.length - 1].length + 1), ry + lines.length - 1, GSC.CHARS["▼"], 0);
      }
      entries.push({ row: ry, rows: lines.length });
      const endPx = (ry - top + lines.length) * 8 + i * LOG_GAP;
      if (endPx <= roomPx) fullPx = endPx;
      ry += lines.length;
      if (endPx > roomPx) break;    // one past the bottom: the one sliding out
    }
    lists.push({ screen: list, x0: l, x1: r + 1, y0: top - 1, y1: top + fullPx / 8, step: firstHeight, key, ms: 750,
      entries, entryGap: LOG_GAP });
  }
  const LOG_GAP = 3;     // Game Boy pixels between log entries (a blank row was 8)
  // The routine kinds: only the newest of each shows (the calls - Joey's
  // rematches, the call countdown, no signal; where it hunts).
  const LOG_KIND = [
    // (not the day's recap - it says "$768 from Joey" too, and vanished at
    // Joey's next line: found in the code review, 2026-11-11)
    ["calls", /^(?!.*\brecap\b).*joey|^expecting a call|^no phone signal/i],
    ["hunt", /^hunting on |^staying in .* for the next rotation/i],
  ];
  // ----- the encounter panel, three designs -----
  // Every design: the Pokemon in front of you on the left - its picture
  // (animated), name, DVs and held item - and the ones before it on the
  // right, newest first. They differ in how the ones before it look:
  //   encounters       party icons, two lines each (name / DVs)
  //   encounters_log   one plain line each (name and DVs), many of them
  //   encounters_pics  their own small animated pictures, a few tall rows
  const cur = () => state.current || (state.encounters || [])[0];
  // Which encounter that is: a new one plays its animation again, even the same species.
  const curId = () => { const e = (state.encounters || [])[0]; return e && e.id != null ? e.id : ""; };
  const statLines = c => [
    "ATK" + pad(c.atk, 3) + " DEF" + pad(c.def, 3),
    "SPE" + pad(c.spe, 3) + " SPC" + pad(c.spc, 3)];

  // The current one, its text beside the picture (needs ~21 tiles).
  function nowBeside(l, r, top, rows) {
    const c = cur();
    if (!c) { s.text(l, top + 1, "WAITING FOR AN ENCOUNTER".slice(0, r - l)); return; }
    pictures.push({ slot: "cur:" + curId(), play: "once", species: c.species, shiny: !!c.shiny, x: l, y: top, half: true });
    const tx = l + 8, w = Math.max(0, r - tx);
    // Like the game's stats screen: one stat a line.
    [up(name(c.species)), "ATK" + pad(c.atk, 4), "DEF" + pad(c.def, 4), "SPE" + pad(c.spe, 4), "SPC" + pad(c.spc, 4),
     c.item ? up(c.item) : "NO ITEM", c.shiny ? "SHINY!" : (c.streak > 1 ? `${c.streak} IN A ROW` : "")]
      .forEach((t, i) => { if (i < rows) s.text(tx, top + i, t.slice(0, w)); });
  }
  // The current one, its text under the picture (needs 11 rows, 13 tiles).
  function nowStacked(l, r, top, rows) {
    const c = cur();
    if (!c) { s.text(l, top + 1, "WAITING"); return; }
    pictures.push({ slot: "cur:" + curId(), play: "once", species: c.species, shiny: !!c.shiny, x: l + Math.max(0, Math.floor((r - l - 7) / 2)), y: top, half: true });
    [up(name(c.species)) + (c.shiny ? " SHINY" : ""), ...statLines(c), c.item ? up(c.item) : "NO ITEM"]
      .forEach((t, i) => { if (7 + i < rows) s.text(l, top + 7 + i, t.slice(0, r - l)); });
  }
  // "x7": the same species 3 times or more in a row, at the area's right
  // edge (right, in tiles) by the picture's top (row). A new count pops.
  function streakBadge(c, right, row) {
    const st = state.streak;
    if (!st || !(st.n >= 3) || st.species !== c.species) return;
    const key = st.species + ":" + st.n;
    if (key !== streakPump.key) streakPump = { key, at: performance.now() };
    badges.push({ text: "x" + st.n, right, row });
  }
  const divider = (col, top, bottom) => { for (let row = top; row <= bottom; row++) s.put(col, row, GSC.CHARS["│"], 0); };
  const previous = n => (state.encounters || []).slice(1, 1 + n);

  // A: party icons, two lines each.
  function encounters(x, y, w, h) {
    const l = x + 2, r = x + w - 2, top = y + 1, rows = h - 3;
    const split = Math.min(r - 15, l + 19);
    nowBeside(l, split - 1, top, rows);
    divider(split, top, top + rows - 1);
    const n = Math.min(6, Math.floor(rows / 2));
    previous(n).forEach((m, i) => {
      const ry = top + i * 2;
      icons.push([m.species, split + 2, ry]);
      s.text(split + 5, ry, (up(name(m.species)) + (m.shiny ? " SHINY" : "")).slice(0, r - split - 5));
      // The held item only where it fits whole after the DVs.
      const withItem = dvs(m) + (m.item ? "  " + up(m.item) : "");
      s.text(split + 5, ry + 1, withItem.length <= r - split - 5 ? withItem : dvs(m));
    });
  }

  // B: one line each - the most at once.
  function encountersLog(x, y, w, h) {
    const l = x + 2, r = x + w - 2, top = y + 1, rows = h - 3;
    const split = l + 14;
    nowStacked(l, split - 1, top, rows);
    divider(split, top, top + rows - 1);
    previous(rows).forEach((m, i) => {
      const d = dvs(m);
      s.text(split + 2, top + i, up(name(m.species)).slice(0, Math.max(1, r - split - 3 - d.length)));
      s.text(r - d.length, top + i, d);
    });
  }

  // C: the current one on the left - its stats at the bottom, its picture
  // just above them - and the ones before it on the right, a row each with
  // its own small picture snug against its text. A new encounter slides
  // the rows down one: the newest in at the top, the oldest out at the
  // bottom (the rows are on their own layer for that - see lists).
  // Its two parts are areas you can move and size in the editor (layouts.js
  // AREAS): "current" and "list"; the list's row height is a setting too.
  function encountersPics(x, y, w, h, p) {
    centred(x + 2, w - 4, y + 1, "RECENT ENCOUNTERS");
    const A = AC_LAYOUT.areaOf(p, "current", w, h), B = AC_LAYOUT.areaOf(p, "list", w, h);
    // The current one: its stats at the area's bottom, its picture centred
    // in the space above them.
    const l = x + A.x, top = y + A.y, bottom = y + A.y + A.h - 1, textW = A.w - 1;
    const c = cur();
    if (c) {
      const lines = [up(name(c.species)) + (c.shiny ? " SHINY" : ""), ...statLines(c), c.item ? up(c.item) : "NO ITEM"];
      const ly = bottom - lines.length + 1;
      lines.forEach((t, i) => s.text(l, ly + i, t.slice(0, textW)));
      // At the panels' own pixel size (crisp; 0.75 of the old 3x would make
      // uneven pixels), measured from what the picture actually covers: in
      // the middle of the area, between its top and the stats.
      const areaTop = top * T + 4 * SCALE, areaBottom = ly * T;
      pictures.push({ slot: "cur:" + curId(), play: "once", species: c.species, shiny: !!c.shiny, k: SCALE,
        align: { cx: (l + (A.w - 1) / 2) * T, cy: (areaTop + areaBottom) / 2 } });
      streakBadge(c, l + A.w, top + 1);
    } else {
      s.text(l, top + 1, "WAITING");
    }
    // The ones before it: a row each, step tiles apart - from 4 up three
    // lines (name, DVs, item), below that two (name, then the DVs with the
    // item after them where it fits) - from a row under the area's top (the
    // top picture can reach up into it).
    const bx = x + B.x, br = x + B.x + B.w - 1, listTop = y + B.y + 1, listBottom = y + B.y + B.h - 1;
    const step = AC_LAYOUT.optOf(p, "rowStep"), n = Math.max(0, Math.floor((listBottom - listTop + 1) / step));
    const list = new gsc.Screen(W, H, null);
    const tx = bx + 5;                          // the text column; the pictures end just left of it
    const rowsOf = (state.encounters || []).slice(1, 2 + n);   // one more than fits: the one sliding out
    rowsOf.forEach((m, i) => {
      const ry = listTop + i * step;
      // Two lines: the held item after the DVs where it fits, else after the
      // name, else left out (a narrow list area).
      const nm = up(name(m.species)) + (m.shiny ? " SHINY" : ""), room = br - tx;
      const item = m.item ? " " + up(m.item) : "";
      const lines = step >= 4
        ? [nm, dvs(m)].concat(m.item ? [up(m.item)] : [])
        : (dvs(m) + item).length <= room ? [nm, dvs(m) + item]
        : (nm + item).length <= room ? [nm + item, dvs(m)] : [nm, dvs(m)];
      lines.forEach((t, j) => list.text(tx, ry + j, t.slice(0, Math.max(0, br - tx))));
      // Fitted to its row: at most its text's lines and a quarter tile above
      // and below (a big Pokemon is drawn smaller, a small one as it is).
      pictures.push({ slot: "enc" + (m.id != null ? m.id : i + ":" + m.species), species: m.species, shiny: !!m.shiny,
        small: true, list: lists.length, fitH: Math.min(step, lines.length + 0.5),
        align: { right: tx * T - 3 * SCALE, cy: ry * T + 4 * SCALE + lines.length * T / 2 } });
    });
    // Visible from the area's top to half a row past the last entry's text
    // (its picture reaches a little below it) - so the one waiting below
    // doesn't peek in before it slides.
    lists.push({ screen: list, x0: bx, x1: br + 1, y0: listTop - 1, y1: listTop + n * step - 1, below: 0.5, step,
      key: rowsOf.length ? String(rowsOf[0].id != null ? rowsOf[0].id : JSON.stringify(rowsOf[0])) : null });
  }
  // Older single-part modules, kept for layouts that use them.
  function nowPanel(x, y, w, h) { nowStacked(x + 2, x + w - 2, y + 1, h - 3); }
  function before(x, y, w, h) {
    const l = x + 2, r = x + w - 2, top = y + 1, rows = h - 3;
    previous(Math.min(6, Math.floor(rows / 2))).forEach((m, i) => {
      const ry = top + i * 2;
      icons.push([m.species, l, ry]);
      s.text(l + 3, ry, up(name(m.species)).slice(0, r - l - 3));
      s.text(l + 3, ry + 1, dvs(m).slice(0, r - l - 3));
    });
  }
  // What lives here right now: the time of day it is (it switches with
  // it), or the water while surfing. Two columns - the left one fills
  // first - each Pokemon its party icon, name and odds. ▶ marks the targets.
  // opts.oneCol: one column, the whole width (the info bar's card).
  function wild(x, y, w, h, opts = {}) {
    const l = x + 2, r = x + w - 2;
    const here = state.here || {};
    const tod = here.now || state.time_of_day;
    const surf = here.kind === "surf", fish = here.kind === "fish", tree = here.kind === "tree";
    const where = up(state.location || "HERE");
    const when = tod ? " " + (TOD_WORD[tod] || tod) : "";
    // What the bot is doing names the table: the rod while fishing, the tree
    // while headbutting (a rare one says so), the water while surfing.
    let heading = fish ? `${here.rod || "FISHING"}: ${where}${when}`
      : tree ? `${here.tree === "RARE" ? "RARE TREE" : "HEADBUTT"}: ${where}`
      : surf ? `ENCOUNTERS: ${where} WATER` : `ENCOUNTERS: ${where}${when}`;
    // (too long for a narrow panel: without "ENCOUNTERS:", then cut)
    if (heading.length > r - l) heading = heading.replace(/^ENCOUNTERS: /, "");
    centred(l, r - l, y + 1, heading.slice(0, r - l));
    // The list for the time of day it is now (switches with the clock and
    // the colours), else whatever the bot marked as current. Trees don't
    // change with the clock: just their list.
    const byTime = here[{ MORN: "morn", DAY: "day", NITE: "nite" }[tod]];
    const list = (surf ? here.water : (byTime && byTime.length ? byTime : here.list)) || [];
    const perCol = Math.max(1, Math.floor((h - 5) / 2));   // rows from y+3, two tiles each
    const cols = opts.oneCol ? 1 : 2;
    const colW = opts.oneCol ? r - l : Math.floor((r - l - 1) / 2);   // a tile between the columns
    const shown = list.slice(0, perCol * cols);
    const targets = new Set(state.targets || []);
    const caught = new Set(Array.isArray(state.caught) ? state.caught : []);   // caught shiny already: icon in colour
    shown.forEach((m, i) => {
      const col = Math.floor(i / perCol), row = i % perCol;
      const cx = l + col * (colW + 1), ry = y + 3 + row * 2, nx = cx + 3;
      const odds = m.odds + "%";
      const mark = targets.has(m.species) ? "▶" : "";
      s.text(nx, ry, (mark + up(name(m.species))).slice(0, Math.max(1, cx + colW - nx - odds.length - 1)));
      s.text(cx + colW - odds.length, ry, odds);
      // The icon by what it covers: centred on the name's line, its right
      // edge three pixels before the name.
      icons.push([m.species, cx, ry, { right: nx * T - 3 * SCALE, cy: ry * T + 4 * SCALE + T / 2 }, caught.has(m.species)]);
    });
    if (state.here && !list.length) centred(l, r - l, y + 4, fish && !here.rod ? "NO ROD ON SELECT" : fish ? "NO FISH HERE" : tree ? "NO TREE POKEMON HERE" : "NOTHING LIVES HERE");
    // More than fit (rare): the last place says how many more.
    if (list.length > shown.length && shown.length) {
      const cx = opts.oneCol ? l : l + colW + 1, ry = y + 3 + (perCol - 1) * 2;
      s.text(cx + 3, ry, `AND ${list.length - shown.length + 1} MORE`.slice(0, colW - 3));
    }
  }

  // ----- cards: panels that take turns (the user, 2026-11-10: the luck
  // board and the most met with the encounter table, the shiny history
  // with the recent shinies). Which of n shows now, each sec seconds.
  const cardNow = (sec, n) => sec > 0 && n > 1 ? Math.floor(Date.now() / (sec * 1000)) % n : 0;
  // A ranked board, like the wild table: the heading, then rows two tiles
  // apart with icons, down the first column then the second. Each row:
  // {species, wide, narrow} - the right-hand text for a wide column (24+
  // tiles) or a narrow one. opts: oneCol, foot (a line at the bottom), empty.
  function board(x, y, w, h, heading, rows, opts = {}) {
    const l = x + 2, r = x + w - 2;
    centred(l, r - l, y + 1, heading.slice(0, r - l));
    const perCol = Math.max(1, Math.floor((h - 5 - (opts.foot ? 3 : 0)) / 2));   // (the foot: a row clear above it, one under it)
    const cols = opts.oneCol ? 1 : 2;
    const colW = cols === 1 ? r - l : Math.floor((r - l - 1) / 2);
    const caught = new Set(Array.isArray(state.caught) ? state.caught : []);
    rows.slice(0, perCol * cols).forEach((it, i) => {
      const col = Math.floor(i / perCol), row = i % perCol;
      const cx = l + col * (colW + 1), ry = y + 3 + row * 2, nx = cx + 3;
      const right = String(colW >= 24 ? it.wide : it.narrow);
      s.text(nx, ry, (it.species ? up(name(it.species)) : "EGG").slice(0, Math.max(1, cx + colW - nx - right.length - 1)));
      s.text(cx + colW - right.length, ry, right);
      if (it.species) icons.push([it.species, cx, ry, { right: nx * T - 3 * SCALE, cy: ry * T + 4 * SCALE + T / 2 }, it.coloured != null ? it.coloured : caught.has(it.species)]);
    });
    if (!rows.length) centred(l, r - l, y + 4, opts.empty || "NOTHING YET");
    if (opts.foot && rows.length) centred(l, r - l, y + h - 3, opts.foot.slice(0, r - l));
  }
  // Most over the odds first: met / (8192 x (shinies + 1)) - "2.0X" is
  // twice the odds met without a shiny (the user: "the most over odds first place").
  function luckCard(x, y, w, h, opts = {}) {
    const rows = (state.luck || []).map(m => ({ species: m.species,
      narrow: m.x.toFixed(1) + "X",
      wide: `${fmt(m.met)} ${m.x.toFixed(1)}X` }));   // (its shinies are in the X: per shiny + 1)
    board(x, y, w, h, "MOST OVER THE ODDS", rows, opts);
  }
  // The most met, with their share of every encounter.
  function mostCard(x, y, w, h, opts = {}) {
    const rows = (state.most || []).map(m => ({ species: m.species, narrow: m.pct.toFixed(1) + "%", wide: `${fmt(m.met)}  ${m.pct.toFixed(1)}%` }));
    board(x, y, w, h, "MOST MET" + (state.most_total ? " OF " + fmt(state.most_total) : ""), rows, opts);
  }
  // Every shiny, newest first, and how many encounters it took; under them
  // the average, the luckiest and the unluckiest.
  function historyCard(x, y, w, h, opts = {}) {
    const hs = state.history_stats;
    const rows = (state.history || []).map(m => ({ species: m.species, coloured: true, narrow: fmt(m.took),
      wide: `${fmt(m.took)} ${((m.took || 0) / 8192).toFixed(1)}X` }));
    board(x, y, w, h, "SHINY HISTORY" + (hs ? ` (${hs.count})` : ""), rows,
      Object.assign({ empty: "NONE YET", foot: hs ? `AVG ${fmt(hs.avg)}  BEST ${fmt(hs.best)}  WORST ${fmt(hs.worst)}` : "" }, opts));
  }
  // The panels with cards: the editor's "Card turns" (seconds each, 0 off).
  // A card takes its turn only once it has something to show (the user,
  // 2026-11-10: "make sure they only show once they gathered some data") -
  // until then the others share the time.
  const has = a => Array.isArray(a) && a.length > 0;
  const wildCards = () => [wild, ...(has(state.luck) ? [luckCard] : []), ...(has(state.most) ? [mostCard] : [])];
  const cardSec = p => p ? AC_LAYOUT.optOf(p, "card") || 0 : 0;
  function wildPanel(x, y, w, h, p) {
    const cards = wildCards();
    cards[cardNow(cardSec(p), cards.length)](x, y, w, h, {});
  }
  function shiniesPanel(x, y, w, h, p) {
    if (has(state.history) && cardNow(cardSec(p), 2) === 1) historyCard(x, y, w, h);
    else shinies(x, y, w, h, p);
  }

  // How long ago, in words: "1 DAY 3 HRS", "5 HRS 2 MIN", "40 MIN",
  // "JUST NOW". Longer than fit (max letters) - "3 DAYS 18 HRS" - it
  // keeps only the bigger unit: "3 DAYS".
  function agoWords(t, fit = 11) {
    if (!t) return "";
    const s = Math.max(0, Math.floor(Date.now() / 1000) - t);
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    const unit = (n, one, many) => `${n} ${n === 1 ? one : many}`;
    let big, small;
    if (d) { big = unit(d, "DAY", "DAYS"); small = h ? unit(h, "HR", "HRS") : ""; }
    else if (h) { big = unit(h, "HR", "HRS"); small = m ? unit(m, "MIN", "MIN") : ""; }
    else return m ? unit(m, "MIN", "MIN") : "JUST NOW";
    const both = small ? big + " " + small : big;
    return both.length <= fit ? both : big;
  }
  // Text centred in a width starting at column c0.
  const centred = (c0, width, row, text) => {
    const t = String(text).slice(0, width);
    s.text(c0 + Math.floor((width - t.length) / 2), row, t);
  };

  // Recent shinies: the heading centred; under each picture, centred, its
  // name, its DVs and how long ago. The row of them is centred in its area
  // ("row" - movable and sizable in the editor), each slot tiles wide (a
  // setting: narrower, more of them).
  function shinies(x, y, w, h, p) {
    centred(x + 2, w - 4, y + 1, "RECENT SHINIES");
    const R = AC_LAYOUT.areaOf(p, "row", w, h);
    const l = x + R.x, rw = R.w, top = y + R.y;
    const slot = AC_LAYOUT.optOf(p, "slot"), n = Math.max(1, Math.floor(rw / slot));
    const list = (state.recent_shinies || []).slice(0, n);
    const x0 = l + Math.floor((rw - list.length * slot) / 2);
    list.forEach((m, i) => {
      const sx = x0 + i * slot;
      pictures.push({ slot: "shiny" + i, species: m.species, shiny: true, play: "every", wait: 1500 + i * 7000, x: sx + Math.floor((slot - 7) / 2), y: top, half: true });
      centred(sx, slot, top + 7, up(name(m.species)));
      centred(sx, slot, top + 8, dvs(m));
      centred(sx, slot, top + 9, agoWords(m.time));
    });
    if (!list.length) centred(l, rw, top + 2, "NONE YET");
  }

  // The info bar. Left: the weekday and time, where and what time of day;
  // under them what the bot is working on (target, goal, next, the phone).
  // Middle: the lifetime numbers. Narrow: all in one column.
  const DAYTIME_WORD = { MORN: "MORNING", DAY: "DAY", NITE: "NIGHT" };
  function info(x, y, w, h, p) {
    const l = x + 2, r = x + w - 2, rows = h - 3;
    const targets = (state.targets || []).map(id => up(name(id)));
    // Label: value, every value starting on the same column (after the
    // longest label).
    const LABELS = ["TIME:", "LOCATION:", "DAYTIME:", "TARGET:", "NEXT ROTATION:"];
    const at = Math.max(...LABELS.map(a => a.length)) + 1;
    const room = (r - l >= 66 ? Math.max(l + 38, r - 27) - 1 - l : r - l) - at;
    // The targets and the rotation get two rows each, the words wrapped onto
    // the second (the user, 2026-11-08: both were cut short). Every target
    // by name, in the hunt's order (this map's own first) - "AND N MORE" only when
    // even two rows can't hold them all.
    const wrap = (text, n) => {        // -> up to n lines, or null: doesn't fit
      const lines = [""];
      for (const word of text.split(" ")) {
        const cur = lines[lines.length - 1], joined = cur ? cur + " " + word : word;
        if (joined.length <= room) lines[lines.length - 1] = joined;
        else if (lines.length < n && word.length <= room) lines.push(word);
        else return null;
      }
      return lines;
    };
    let targetLines = ["ANY SHINY"];
    if (targets.length) {
      targetLines = null;
      for (let k = targets.length; k >= 1 && !targetLines; k--) {
        const more = targets.length - k;
        targetLines = wrap(targets.slice(0, k).join(", ") + (more ? ` AND ${more} MORE` : ""), 2);
      }
      if (!targetLines) targetLines = [targets[0].slice(0, room)];
    }
    // (map names spaced here too - "Route36" -> "ROUTE 36" - whatever the
    // bot sends; the launcher does it as well since 2026-11-08)
    const spacedMaps = t => String(t).replace(/([a-z])([A-Z])/g, "$1 $2").replace(/([A-Za-z])(\d)/g, "$1 $2").replace(/(\d)([A-Z][a-z])/g, "$1 $2");
    const nextText = up(spacedMaps(state.next || "-"));
    const nextLines = wrap(nextText, 2) || [nextText.slice(0, room), nextText.slice(room, 2 * room)];
    const labelled = [
      ["TIME:", clockText() || "-"],
      ["LOCATION:", up(state.location || "-")],
      ["DAYTIME:", DAYTIME_WORD[state.time_of_day] || "-"],
      ["TARGET:", targetLines[0]],
      ["", targetLines[1]],
      ["NEXT ROTATION:", nextLines[0]],
      ["", nextLines[1]],
    ];
    const place = labelled.map(([a, b]) => b ? [a, b, at] : [a]);
    // On the panel's last row, however tall it is.
    const ph = state.phase;
    const work = [
      ["CURRENT PHASE SHINIES " + (ph && ph.total ? `${ph.caught}/${ph.total}` : "-")],
    ];
    const numbers = [
      ["TOTAL ENCOUNTERS", fmt(state.total)],
      ["TOTAL SHINIES", fmt(state.shinies)],
      ["SINCE LAST", fmt(state.since_shiny)],
      ["PER HOUR", state.per_hour ? fmt(state.per_hour) : "-"],
      ["RUNTIME", runtimeText(state.runtime)],
      ["MONEY FROM JOEY", "¥" + fmt(state.joey)],
    ];
    // A label, then its value: at a set column (at), or right-aligned.
    // Onto screen sc: the top rows go on their own layer (spaced), the
    // phase line onto the panel's.
    const spaced = new gsc.Screen(W, H, null);
    let lastSpaced = 0;
    const put = (sc0, c0, c1, row, [a, b, at]) => {
      if (row > rows || c1 <= c0) return;
      if (sc0 === spaced) lastSpaced = Math.max(lastSpaced, row);
      sc0.text(c0, y + row, (a || "").slice(0, c1 - c0));
      if (!b) return;
      if (at) sc0.text(c0 + at, y + row, b.slice(0, Math.max(0, c1 - c0 - at)));
      else sc0.text(c1 - b.length, y + row, b);
    };
    const workTop = rows - work.length + 1;
    if (r - l >= 66) {
      // The numbers against the panel's right edge, 27 tiles wide.
      const midEnd = r, mid = Math.max(l + 38, r - 27);
      place.forEach((it, i) => put(spaced, l, mid - 1, 1 + i, it));
      // (the numbers take turns with the wild table, the luck board and the
      // most met, like cards: the editor's "Card turns" - seconds each, 0 off;
      // only the cards with something to show)
      const cards = wildCards();
      const k = cardNow(cardSec(p), 1 + cards.length);
      if (k > 0) cards[k - 1](mid - 2, y, midEnd - mid + 4, h, { oneCol: true });
      else numbers.forEach((it, i) => put(spaced, mid, midEnd, 1 + i, it));
      work.forEach((it, i) => put(s, l, mid - 2, workTop + i, it));
    } else {
      [...place, [""], ...numbers].forEach((it, i) => put(spaced, l, r, 1 + i, it));
      work.forEach((it, i) => put(s, l, r, workTop + i, it));
    }
    // The top rows a little apart: INFO_GAP Game Boy pixels between rows
    // (the smallest there is: 1).
    if (lastSpaced) lists.push({ screen: spaced, x0: l, x1: r + 1, y0: y + 1, y1: y + lastSpaced + 1, gap: INFO_GAP, key: null });
  }
  const INFO_GAP = 1;

  function title(x, y, w, h, p) {
    s.text(x + 2, y + Math.max(1, Math.floor((h - 3) / 2)), up(p.text || "AUTOCRYSTAL").slice(0, Math.max(0, w - 4)));
  }

  const DRAW = { chat, encounters, encounters_log: encountersLog, encounters_pics: encountersPics, now: nowPanel, before, wild: wildPanel, shinies: shiniesPanel, info, title };

  function layout() {
    frames = new gsc.Screen(W, H, null);
    s = new gsc.Screen(W, H, null);
    panels = []; pictures = []; icons = []; lists = []; badges = [];
    for (const p of LAYOUT.panels || []) {
      const x = Math.round(p.x / T), y = Math.round(p.y / T);
      const w = Math.max(5, Math.round(p.w / T)), h = Math.max(3, Math.round(p.h / T));
      frames.panel(x, y, w, h);
      panels.push([x, y, w, h]);
      if (DRAW[p.type]) DRAW[p.type](x, y, w, h, p);
    }
    return [frames, s];
  }

  // ----- the pictures' animations -----
  // The Pokemon's own animation from the game (the one it plays when it
  // appears in battle). How often, by the picture's play:
  //   "once"   the current encounter: plays when it appears, then holds still
  //            (a new encounter plays again, even the same species)
  //   "every"  recent shinies: again every ~30 s, each on its own clock
  //            (wait: when it first plays after a (re)load, so they're spread)
  //   (none)   the encounter rows: loop like a GIF, with a short still pause
  const LOOP_PAUSE_MS = [900, 1500];       // still between loops: from, to
  const EVERY_MS = [26000, 34000];         // "every": still between plays, from, to
  const between = ([a, b]) => a + Math.random() * (b - a);
  const anims = new Map();
  const animKey = q => q.slot || (q.species + ":" + q.x + ":" + q.y);
  if (params.has("debug")) window.acAnims = anims;   // for checking the timing from the console
  function animate(q) {
    const key = animKey(q);
    const now = performance.now();
    let st = anims.get(key);
    if (!st || st.species !== q.species || st.shiny !== q.shiny || st.play !== q.play) {
      const first = q.play === "every" ? now + (q.wait || 0) : now + Math.random() * 1200;
      st = { species: q.species, shiny: q.shiny, play: q.play, seq: null, t0: now, next: first, done: false, data: null };
      anims.set(key, st);
      GSC.monAnims("gfx/", q.species).then(a => {
        st.data = a;
        if (a.intro.length && loadedOnce) { st.seq = a.intro; st.t0 = performance.now(); }   // a new arrival: right away
      });
    }
    q.anim = st;
  }
  let loadedOnce = false;
  setTimeout(() => { loadedOnce = true; }, 2000);   // the first pictures after a (re)load start staggered
  function frameOf(q, t, count) {
    const st = q.anim;
    if (!st || !st.data) return 0;
    if (!st.seq && !st.done && t >= st.next) {
      st.seq = st.data.intro.length ? st.data.intro : st.data.idle;
      st.t0 = t;
    }
    if (!st.seq || !st.seq.length) return 0;
    let at = (t - st.t0) * 60 / 1000;   // game frames since it started

      const q = drawn[i];
      if (!pic || !q) return;
      const [px, py, k2] = placeOf(q, pic, sc, tt, half);
      const img = pic[frameOf(q, t, pic.length)] || pic[0];
      if (q.list != null && drawnLists[q.list]) {
        ctx.save();
        ctx.beginPath(); ctx.rect(...clipOf(drawnLists[q.list])); ctx.clip();
        ctx.drawImage(img, px, py + slideOf(q.list, t, tt), 56 * k2, 56 * k2);
        ctx.restore();
      } else {
        ctx.drawImage(img, px, py, 56 * k2, 56 * k2);
      }
    });
    // Party icons bob between their two frames, like in the party menu.
    const f = Math.floor((t - start) / 400) % 2;
    for (const [species, x, y, align, coloured] of drawnIcons) {
      const ic = icon(species, coloured);
      if (!ic) continue;
      let ix = x * tt, iy = y * tt + half;
      if (align) {
        const b = iconBounds(ic);
        ix = Math.round(align.right - (b.r + 1) * sc);
        iy = Math.round(align.cy - (b.t + b.b + 1) * sc / 2);
      }
      ctx.drawImage(ic, 0, f * 16, 16, 16, ix, iy, 16 * sc, 16 * sc);
    }
    // The streak badge: the game's letters at twice the size, popping to
    // 1.6x and settling back when the count goes up.
    for (const b of drawnBadges) {
      const cv = badgeCanvas(b.text);
      const p = Math.min(1, Math.max(0, (t - streakPump.at) / BADGE_POP_MS));
      const k = sc * 2 * (1 + 0.6 * Math.pow(1 - p, 2));
      const w = cv.width * k, h = cv.height * k;
      const cx = b.right * tt - cv.width * sc, cy = b.row * tt + half + cv.height * sc;
      const bx = Math.round(cx - w / 2), by = Math.round(cy - h / 2);
      ctx.drawImage(cv, bx, by, w, h);
      if (ink > 0.01) { ctx.globalAlpha = ink; ctx.drawImage(whiteOf(cv), bx, by, w, h); ctx.globalAlpha = 1; }
    }
    drawVote();   // a chat poll or bet: over the game, on top of everything
  }
  const BADGE_POP_MS = 380;
  // The badge's letters on their own little tile layer (one per text, per
  // look of the font).
  function badgeCanvas(text) {
    const cache = gsc.badgeCache || (gsc.badgeCache = new Map());
    if (!cache.has(text)) {
      const scr = new gsc.Screen(text.length, 1, null);
      scr.text(0, 0, text);
      cache.set(text, gsc.render(scr, 0));
    }
    return cache.get(text);
  }

  // ----- chat polls and bets (the user, 2026-11-11) -----
  // Drawn over the game itself, in the game's own text boxes - the game
  // doesn't change. First a Pokegear-call box at the top (the phone icon,
  // "CHAT POLL!" / "CHAT BET!" and how to join) for ANNOUNCE_S, then the box
  // where the game's text box and battle menu are: the question, the time
  // left, the options with their shares. Where the Game Boy screen is:
  // AC_LAYOUT.screenOf (the editor's "Game Boy screen" numbers).
  // The vote (the relay's, from POST /vote - the editor's Test buttons post
  // a sample; YouTube chat gets connected later):
  //   { id (new for each), kind: "poll" | "bet", question, options (2-4; a
  //     bet's are YES and NO unless given), votes (a count per option),
  //     started, ends (Unix seconds), result (the winning option's index,
  //     once known), pot (a bet's, optional), howto (the announcement's two
  //     lines) and hint (the box's, optional), test (made-up votes) }
  // Shares only, never head counts: an early stream's 2 votes look sad.
  // Gone CLOSED_S after it ends, or RESULT_S after its result came - even if
  // whatever posts it stops, so a stuck box can't stay on the stream.
  const ANNOUNCE_S = 8, CLOSED_S = 20, RESULT_S = 30;
  const VOTE_PAPER = [[248, 248, 248], [168, 168, 168], [96, 96, 96], [0, 0, 0]];   // the game's text box
  const VOTE_COLOURS = ["#00b800", "#f80000", "#3890f8", "#f8b800"];   // a bet's bars (the HP bar's green, red...)
  const TEST_VOTE = params.get("vote");   // ?vote=poll / ?vote=bet: a sample, over and over (lining it up in OBS)
  let vote = null, voteSeen = 0, resultSeen = 0;
  function setVote(v) {
    const nowS = Date.now() / 1000;
    v = v && typeof v === "object" ? v : null;
    if (v && (!vote || vote.id !== v.id)) { voteSeen = nowS; resultSeen = 0; }
    if (v && v.result != null && !resultSeen) resultSeen = nowS;
    vote = v;
  }
  if (TEST_VOTE) {
    setVote(AC_LAYOUT.testVote(TEST_VOTE));
    setInterval(() => setVote(AC_LAYOUT.testVote(TEST_VOTE)), 90000);
  }
  // What to show now (null: nothing).
  function voteView(nowS) {
    const v = vote;
    if (!v) return null;
    const kind = v.kind === "bet" ? "bet" : "poll";
    const options = (Array.isArray(v.options) && v.options.length ? v.options : kind === "bet" ? ["YES", "NO"] : [])
      .slice(0, 4).map(o => readable(String(o)).toUpperCase());
    if (options.length < 2) return null;
    const started = Number(v.started) || voteSeen, ends = Number(v.ends) || started + 300;
    let votes = options.map((_, i) => Math.max(0, Number((v.votes || [])[i]) || 0));
    let result = v.result != null && options[Number(v.result)] != null ? Number(v.result) : null;
    let settled = resultSeen;
    if (v.test) {
      // Made-up votes coming in, the result when it ends.
      const el = Math.max(0, Math.min(nowS, ends) - started);
      votes = options.map((_, i) => Math.max(0, Math.round(el * [1.3, 0.9, 0.6, 0.4][i] + 3 * Math.sin(el / 4 + i * 2))));
      if (nowS >= ends) { result = votes.indexOf(Math.max(...votes)); settled = ends; }
    }
    const until = result != null ? (settled || nowS) + RESULT_S : ends + CLOSED_S;
    if (nowS > until) return null;
    const total = votes.reduce((a, b) => a + b, 0);
    const n = options.length;
    const list = kind === "bet" ? options.join(" or ") : n === 2 ? "1 or 2" : n === 3 ? "1, 2 or 3" : "1 to " + n;
    const howto = Array.isArray(v.howto) && v.howto.length
      ? [String(v.howto[0] || ""), String(v.howto[1] || "")]
      : [("Type " + list).length <= 15 ? "Type " + list : kind === "bet" ? "Type your pick" : "Type 1 to " + n,
         kind === "bet" ? "in chat to bet!" : "in chat to vote!"];
    let hint = v.hint ? String(v.hint) : kind === "bet" ? "Bet: type " + options.join("/") : "Vote: type " + (n === 2 ? "1 or 2" : "1-" + n);
    if (hint.length > 18) hint = kind === "bet" ? "Bet in chat!" : "Vote in chat!";
    return {
      kind, options, total, result, started, ends, test: !!v.test,
      pct: votes.map(c => total ? Math.round(100 * c / total) : null),
      lead: total ? votes.indexOf(Math.max(...votes)) : -1,
      open: nowS < ends && result == null,
      announce: nowS - started < ANNOUNCE_S && nowS < ends && result == null,
      since: nowS - started,
      question: readable(String(v.question || (kind === "bet" ? "PLACE YOUR BETS!" : "CHAT POLL!"))).toUpperCase(),
      pot: v.pot != null && isFinite(Number(v.pot)) ? Number(v.pot) : null,
      howto: howto.map(readable), hint: readable(hint),
    };
  }
  const leftText = s => {
    s = Math.max(0, Math.ceil(s));
    return s >= 3600 ? Math.floor(s / 3600) + "h" + String(Math.floor(s % 3600 / 60)).padStart(2, "0")
      : Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };
  // The game's graphics with the text box's paper added as one more palette.
  let voteG = null, VP = 0;
  function voteGfx() {
    if (!voteG || voteG.base !== gsc) {
      voteG = Object.create(gsc);
      voteG.base = gsc;
      voteG.palettes = gsc.palettes.concat([VOTE_PAPER]);
      VP = voteG.palettes.length - 1;
    }
    return voteG;
  }
  const PHONE_ICON = [0x44, 0x45, 0x54, 0x55];   // the Pokegear's phone (2x2 tiles)
  // The Game Boy screen's 20x18 tiles: the announcement or the box, and the
  // bars to draw over it ([row, share, colour]).
  function voteScreen(V, nowS) {
    const g = voteGfx(), s = new g.Screen(20, 18, null, VP), bars = [];
    const alt = Math.floor(nowS / 4) % 2 === 1;   // every 4 s: the other line
    if (V.announce) {
      s.textbox(0, 0, 3, 18, VP);
      s.text(1, 1, V.kind === "bet" ? "CHAT BET!" : "CHAT POLL!", VP);
      s.text(1, 2, V.howto[0].slice(0, 15), VP);
      s.text(1, 3, V.howto[1].slice(0, 18), VP);
      s.put(17, 1, PHONE_ICON[0], 3); s.put(18, 1, PHONE_ICON[1], 3); s.put(17, 2, PHONE_ICON[2], 3); s.put(18, 2, PHONE_ICON[3], 3);
      return { g, s, bars, shake: V.since < 0.7 ? (Math.floor(V.since * 14) % 2 ? 1 : -1) : 0 };
    }
    const n = V.options.length, bet = V.kind === "bet";
    const rows = Math.max(4, bet ? n + 2 : n + 1), top = 16 - rows, r0 = top + 1;
    s.textbox(0, top, rows, 18, VP);
    const won = V.result != null ? (V.options[V.result] + " won!").slice(0, 18) : "";
    const status = V.open ? V.hint : won || "Voting closed!";
    const left = V.open ? leftText(V.ends - nowS) : "";
    const head = left ? V.question.slice(0, 17 - left.length).padEnd(18 - left.length) + left : V.question.slice(0, 18);
    const foot = bet || n + 1 < rows;   // a line of its own for how to join / the result
    s.text(1, r0, foot || !alt ? head : status, VP);
    const mark = i => (V.result != null ? i === V.result : i === V.lead) ? "▶" : " ";
    const pctText = i => V.pct[i] == null ? "  -%" : String(V.pct[i]).padStart(3) + "%";
    V.options.forEach((o, i) => {
      if (bet) {
        s.text(1, r0 + 1 + i, o.slice(0, 4), VP);
        if (V.result === i) s.text(5, r0 + 1 + i, "▶", VP);
        s.text(14, r0 + 1 + i, pctText(i), VP);
        bars.push([r0 + 1 + i, V.pct[i] || 0, VOTE_COLOURS[i]]);
      } else {
        s.text(1, r0 + 1 + i, (i + 1) + mark(i) + o.slice(0, 12).padEnd(12) + pctText(i), VP);
      }
    });
    if (foot) s.text(1, top + rows, bet && V.open && V.pot != null && !alt ? "POT " + fmt(V.pot) : status, VP);
    if (blink) s.put(18, 17, GSC.CHARS["▼"], VP);
    return { g, s, bars, shake: 0 };
  }
  const voteWork = document.createElement("canvas");
  voteWork.width = 160; voteWork.height = 144;
  function drawVote() {
    const V = voteView(Date.now() / 1000);
    if (!V || !gsc) return;
    const { g, s, bars, shake } = voteScreen(V, Date.now() / 1000);
    const w = voteWork.getContext("2d");
    w.clearRect(0, 0, 160, 144);
    w.drawImage(g.render(s), shake, 0);
    for (const [row, share, colour] of bars) {   // like the HP bar: black edge, white inside
      const x = 48, y = row * 8 + 2, bw = 64;
      w.fillStyle = "#000"; w.fillRect(x, y, bw, 4);
      w.fillStyle = "#f8f8f8"; w.fillRect(x + 1, y + 1, bw - 2, 2);
      w.fillStyle = colour; w.fillRect(x + 1, y + 1, Math.round((bw - 2) * share / 100), 2);
    }
    const R = AC_LAYOUT.screenOf(LAYOUT);
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(voteWork, R.x, R.y, R.w, R.h);
    if (V.test || TEST_VOTE) {
      // A sample: the Game Boy screen's edge too, to line it up with the game.
      ctx.strokeStyle = "#ff9a1f"; ctx.lineWidth = 2; ctx.setLineDash([10, 6]);
      ctx.strokeRect(R.x - 1, R.y - 1, R.w + 2, R.h + 2);
    }
    ctx.restore();
  }

  // ----- the chat's messages -----
  function wrapText(text, width) {
    width = Math.max(8, width);
    const out = [];
    for (const para of String(text).split("\n")) {
      let ln = "";
      for (let word of para.split(/\s+/).filter(Boolean)) {
        while (word.length > width) { if (ln) { out.push(ln); ln = ""; } out.push(word.slice(0, width)); word = word.slice(width); }
        if (!ln) ln = word;
        else if (ln.length + 1 + word.length <= width) ln += " " + word;
        else { out.push(ln); ln = word; }
      }
      if (ln) out.push(ln);
    }
    return out.length ? out : [""];
  }
  // The bot's lines in the game's font: the characters it lacks swapped for
  // ones it has, and the bot's map names (NewBarkTown, Route29,
  // PlayersHouse1F) spelt out (New Bark Town, Route 29, Players House 1F).
  function readable(text) {
    return String(text || "")
      .replace(/\b[A-Z][A-Za-z0-9]*[a-z][A-Za-z0-9]*\b/g, w =>
        /[a-z][A-Z0-9]/.test(w) ? w.replace(/([a-z])([A-Z0-9])/g, "$1 $2").replace(/(\d)([A-Z][a-z])/g, "$1 $2") : w)
      .replace(/ > /g, " → ").replace(/>/g, "→").replace(/\$/g, "¥").replace(/\+/g, "plus ")
      .replace(/["“”]/g, "'").replace(/[<#*_=~^|{}`\\]/g, " ");
  }
  // (300: ~15 hours of lines at the bot's pace - the user, 2026-11-11: "the log
  // shows data from like 8-15h"; the routine kinds collapse to one each)
  const LOG_KEEP = 300;
  function addMessage(m) {
    log.push({ id: m.id, text: readable(m.text), time: m.time || Math.floor(Date.now() / 1000) });
    while (log.length > LOG_KEEP) log.shift();
    rebuild();
  }

  let lastId = null;
  async function poll() {
    try {
      const r = await fetch("/messages?since=" + (lastId === null ? 0 : lastId), { cache: "no-store" });
      const data = await r.json();
      if (data.state && JSON.stringify(data.state) !== JSON.stringify(state)) { state = data.state; rebuild(); }
      if (!TEST_VOTE && "vote" in data) setVote(data.vote);
      // On (re)load: all the relay keeps, so the log reaches back hours (they don't slide).
      const fresh = lastId === null ? (data.messages || []).slice(-LOG_KEEP) : (data.messages || []);   // (all kept: the log reaches back hours - the routine kinds collapse)
      lastId = data.latest || 0;
      fresh.forEach(addMessage);
    } catch (e) {}
    setTimeout(poll, 300);
  }
  // A newly saved layout.json (OBS picks up the editor's Save by itself)...
  let layoutText = JSON.stringify(LAYOUT);
  async function watchLayout() {
    try {
      const l = await AC_LAYOUT.load(params.get("layout"));
      const text = JSON.stringify(l);
      if (text !== layoutText) { layoutText = text; await apply(l); rebuild(); }
    } catch (e) {}
    setTimeout(watchLayout, 3000);
  }
  // ...or, inside the editor, every change as it's made.
  addEventListener("message", async e => {
    if (e.data && e.data.type === "layout" && e.data.layout) { await apply(e.data.layout); rebuild(); }
    // The editor's "Send a visitor now": the next one, straight away.
    // (With a species: that one, whatever the time and the band.)
    if (e.data && e.data.type === "visitor" && EDIT) { visitor = null; visitNext = 0; forcedVisitor = Number(e.data.species) || null; }
    // The editor's "Unown now": the event, starting over straight away.
    if (e.data && e.data.type === "unown" && EDIT) { unown = null; unownNext = 0; }
    // The editor's Test poll / Test bet / Off.
    if (e.data && e.data.type === "vote" && EDIT) setVote(e.data.vote);
  });

  setInterval(() => { blink = !blink; rebuild(); }, 450);
  setInterval(rebuild, 30000);   // "... AGO" moves on
  await rebuild();
  requestAnimationFrame(frame);
  if (!EDIT) watchLayout();
  if (DEMO) {
    const DEMO_CHAT = ["A SHINY ZUBAT! DVs 15/10/10/10.", "Gotcha! ZUBAT was caught!",
      "JOEY wants a rematch! 4 POKé BALLS left, so I'm heading to ROUTE 30 after this one.",
      "Can't escape! Trying again.", "Hmm, I'm stuck. Trying to free myself...", "It's 6 PM: off to ROUTE 31 for GASTLY."];
    let chatId = 1;
    const nowS = Math.floor(Date.now() / 1000);
    DEMO_CHAT.slice(0, 3).forEach((t, i) => addMessage({ id: chatId++, text: t, time: nowS - (3 - i) * 1500 }));
    setInterval(() => addMessage({ id: chatId++, text: DEMO_CHAT[Math.floor(Math.random() * DEMO_CHAT.length)] }), 15000);
    // A new wild Pokemon every few seconds, so the lists slide in the preview.
    let demoId = 100;
    (state.encounters || []).forEach((m, i) => { m.id = demoId - i; });
    setInterval(() => {
      // The wild ones here, and now and then a big one (56x56 pictures:
      // Onix, Gyarados, Snorlax, Steelix, Tyranitar, Lugia, Ho-Oh) to see they fit.
      const BIG = [95, 130, 143, 208, 248, 249, 250];
      const pick = Math.random() < 0.4 ? BIG[Math.floor(Math.random() * BIG.length)] : (wildNow => wildNow[Math.floor(Math.random() * wildNow.length)].species)(demoWild(state.time_of_day));
      const dv = () => Math.floor(Math.random() * 16);
      const m = { id: ++demoId, species: pick, atk: dv(), def: dv(), spe: dv(), spc: dv(), item: Math.random() < 0.2 ? "BERRY" : "" };
      state.encounters = [m, ...state.encounters].slice(0, 6);
      state.current = Object.assign({ streak: 1 }, m);
      rebuild();
    }, 6000);
    // A fast game clock: a whole day in ?daylen= seconds (300 by default:
    // each look stays a while, and its slow fade shows), to watch the colours
    // go round. Morning/day/night as the game has them.
    const DAY_MS = Math.max(10, Number(params.get("daylen")) || 300) * 1000;
    const startHour = gameHour(), demoStart = performance.now();
    setInterval(() => {
      const hour = (startHour + (performance.now() - demoStart) / DAY_MS * 24) % 24;
      const tod = hour >= 4 && hour < 10 ? "MORN" : hour >= 10 && hour < 18 ? "DAY" : "NITE";
      state.time_of_day = tod;
      if (state.here) { if (state.here.kind !== "tree") state.here.now = tod; state.here.list = demoWild(tod); }
      state.clock = Object.assign({}, state.clock, { hours: Math.floor(hour), minutes: Math.floor((hour % 1) * 60) });
      rebuild();
    }, 500);
  } else {
    poll();
  }
  if (EDIT && parent !== window) parent.postMessage({ type: "scene-ready" }, "*");
})();
</script>
</body>
</html>
